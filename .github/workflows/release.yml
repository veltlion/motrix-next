name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            label: macos-aarch64
          - platform: macos-15-intel
            args: --target x86_64-apple-darwin
            label: macos-x86_64
          - platform: windows-latest
            args: --target x86_64-pc-windows-msvc --bundles nsis
            label: windows-x86_64
          - platform: windows-latest
            args: --target aarch64-pc-windows-msvc --bundles nsis
            label: windows-aarch64
          - platform: ubuntu-22.04
            args: --target x86_64-unknown-linux-gnu
            label: linux-x86_64
          - platform: ubuntu-22.04-arm
            args: --target aarch64-unknown-linux-gnu
            label: linux-aarch64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      # Cross-compilation: add the secondary Rust target when building for
      # a different architecture on the same OS runner.
      # - macOS x86_64 uses a native Intel runner (macos-13), no cross-compile needed.
      # - Windows ARM64 cross-compiles on x64 runner (NSIS is arch-agnostic).
      - name: Add cross-compilation target
        if: contains(matrix.args, 'aarch64-pc-windows-msvc')
        shell: bash
        run: |
          TARGET=$(echo '${{ matrix.args }}' | sed 's/.*--target \([^ ]*\).*/\1/')
          rustup target add "$TARGET"

      - uses: swatinem/rust-cache@v2

      # Suppress needrestart daemon (auto-restarts services on package
      # install, can kill the runner agent and cause "operation canceled").
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          export NEEDRESTART_SUSPEND=1
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo -E apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf xdg-utils

      - run: pnpm install

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.release.tag_name || '' }}
          releaseId: ${{ github.event_name == 'release' && github.event.release.id || '' }}
          includeUpdaterJson: false
          args: ${{ matrix.args }}

      - name: Upload build artifacts (manual trigger only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: motrix-next-${{ matrix.label }}
          path: "${{ join(fromJSON(steps.tauri.outputs.artifactPaths), '\n') }}"
          retention-days: 7

